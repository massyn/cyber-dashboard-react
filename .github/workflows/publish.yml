name: Publish
on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check me out
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install, lint, test and build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cyber-dashboard
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Check me out
        uses: actions/checkout@v7

      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lint and test the data loader
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          ruff check .
          black --check .
          pytest -q

  notify:
    needs: [build, tools]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK secret is not set; skipping Slack notification"
            exit 0
          fi
          if [ "$RESULT" = success ]; then
            colour="#2eb886"; title="Build succeeded"
          else
            colour="#a30200"; title="Build failed"
          fi
          payload=$(jq -n \
            --arg colour "$colour" \
            --arg title "$title: $REPO" \
            --arg run_url "$SERVER/$REPO/actions/runs/$RUN_ID" \
            --arg commit "<$SERVER/$REPO/commit/$SHA|${SHA:0:7}>" \
            --arg message "${COMMIT_MSG%%$'\n'*}" \
            --arg workflow "$WORKFLOW" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            '{attachments: [{
              color: $colour,
              fallback: $title,
              title: $title,
              title_link: $run_url,
              text: $message,
              fields: [
                {title: "Workflow", value: $workflow, short: true},
                {title: "Branch", value: $branch, short: true},
                {title: "Commit", value: $commit, short: true},
                {title: "Triggered by", value: $actor, short: true}
              ],
              ts: (now | floor)
            }]}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK" \
            || echo "::warning::Slack notification failed"
